name: MusicFlow Brain v2 and modular regression verification

on:
  push:
    paths:
      - "docs/Cross_Session_Project_Brain.json"
      - "scripts/project_brain_v2.py"
      - "scripts/test_project_brain_v2.py"
      - "AGENTS.md"
      - "qa/impact_modules.json"
      - "scripts/impact_regression.py"
      - "scripts/test_impact_regression.py"
      - "docs/Modular_Test_Catalog.md"
      - "docs/Test_Impact_Policy.md"
      - "docs/Project_Brain_v2.md"
      - "app/src/**/*Test.kt"
      - ".github/workflows/brain-v2-check.yml"
  pull_request:
    paths:
      - "docs/Cross_Session_Project_Brain.json"
      - "scripts/project_brain_v2.py"
      - "scripts/test_project_brain_v2.py"
      - "AGENTS.md"
      - "qa/impact_modules.json"
      - "scripts/impact_regression.py"
      - "scripts/test_impact_regression.py"
      - "docs/Modular_Test_Catalog.md"
      - "docs/Test_Impact_Policy.md"
      - "docs/Project_Brain_v2.md"
      - "app/src/**/*Test.kt"
      - ".github/workflows/brain-v2-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-brain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout all Git history for source evidence
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test evidence engine and tamper detection
        run: python -m unittest discover -s scripts -p test_project_brain_v2.py -v
      - name: Validate module coverage and selective-regression rules
        run: |
          python -m unittest discover -s scripts -p test_impact_regression.py -v
          python scripts/impact_regression.py validate
      - name: Ensure enumerated test-case catalog matches actual code
        run: |
          python scripts/impact_regression.py catalog
          git diff --exit-code -- docs/Modular_Test_Catalog.md
      - name: Check canonical brain, proof anchors, priority scoring and secrets
        # Android UI tests are NOT run by this workflow. Local APK/QA logs
        # remain unavailable on CI unless committed as portable transcripts.
        run: python scripts/project_brain_v2.py check
